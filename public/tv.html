<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>C.R.I.S. - Mesa Tática (TV)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body, html { width: 100vw; height: 100vh; background: #000000; overflow: hidden; font-family: 'Inter', sans-serif; }
    #tv-viewport { position: absolute; inset: 0; width: 100vw; height: 100vh; overflow: hidden; background: #050508; }
    
    #tv-mapa-container {
      position: absolute;
      top: 0; left: 0;
      transform-origin: top left;
    }
    #tv-mapa-img { width: 100%; height: 100%; pointer-events: none; display: block; }

    .vtt-ping-beacon { position: absolute; pointer-events: none; z-index: 1000; transform: translate(-50%, -50%); }
    .vtt-ping-dot { width: 16px; height: 16px; border-radius: 50%; background-color: #ef4444; box-shadow: 0 0 16px #ef4444; position: absolute; top: -8px; left: -8px; }
    .vtt-ping-ring { position: absolute; top: -40px; left: -40px; width: 80px; height: 80px; border-radius: 50%; border: 3px solid #ef4444; animation: vttPingAnim 1.4s cubic-bezier(0, 0.2, 0.8, 1) forwards; }
    @keyframes vttPingAnim { 0% { transform: scale(0.2); opacity: 1; } 70% { opacity: 0.8; } 100% { transform: scale(2.8); opacity: 0; } }

    #tv-standby-screen { position: fixed; inset: 0; z-index: 99999; background: #08080c; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; opacity: 1; pointer-events: auto; }
    #tv-standby-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    #tv-standby-fallback { display: flex; flex-direction: column; align-items: center; gap: 12px; }

    #dice-canvas { position: fixed; inset: 0; pointer-events: none !important; z-index: 1000000; }
    #dice-canvas canvas { pointer-events: none !important; width: 100vw !important; height: 100vh !important; }

    #toast-rolagem { position: fixed; bottom: 2.5rem; right: 2.5rem; background: rgba(18, 18, 26, 0.95); border: 1px solid #2a2a38; border-left: 6px solid #b91c1c; border-radius: 10px; padding: 16px 28px; display: none; flex-direction: column; gap: 4px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85); z-index: 1000001; pointer-events: none; }
    #toast-rolagem.show { display: flex !important; }
    .toast-titulo { font-size: 0.85rem; font-weight: 700; color: #9494a8; letter-spacing: 1px; }
    .toast-resultado { font-size: 2.8rem; font-weight: 900; font-family: 'Roboto Mono', monospace; color: #ffffff; text-shadow: 0 0 18px rgba(239, 68, 68, 0.6); line-height: 1; margin: 4px 0; }
    .toast-detalhe-txt { font-size: 0.8rem; color: #717182; }

    #toast-turno { 
      position: fixed; 
      top: 2.5rem; 
      right: 2.5rem; 
      background: rgba(18, 18, 26, 0.95); 
      border: 1px solid #2a2a38; 
      border-left: 6px solid #2563eb; 
      border-radius: 10px; 
      padding: 16px 28px; 
      display: none; 
      flex-direction: column; 
      gap: 4px; 
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85); 
      z-index: 1000001; 
      pointer-events: none; 
    }
    #toast-turno.show { display: flex !important; }

    #tv-handout-overlay {
      position: fixed; inset: 0; z-index: 9999999;
      background: rgba(0,0,0,0.85); display: none;
      align-items: center; justify-content: center; backdrop-filter: blur(10px);
    }
    #tv-handout-img {
      max-width: 90%; max-height: 90%; object-fit: contain;
      border: 4px solid #9333ea; border-radius: 8px; box-shadow: 0 0 60px rgba(147, 51, 234, 0.7);
    }
  
    /* OVERLAY CINEMÁTICO DA ORDEM (ESTILO CELLBIT) */
    #tv-cinematic-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      box-shadow: inset 0 0 110px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(0, 0, 0, 0.6);
    }
    #tv-watermark-ordem {
      position: fixed;
      bottom: 20px;
      right: 28px;
      font-family: 'Roboto Mono', monospace;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 5px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      pointer-events: none;
      z-index: 51;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
    }
    #tv-watermark-ordem::before {
      content: "✦ ";
      color: #ef4444;
      opacity: 0.7;
    }

    /* CARD DE CENA / LOCAL ATUAL (PROJEÇÃO CINEMÁTICA) */
    #tv-banner-cena {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }
    #tv-banner-cena.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    #tv-banner-cena-nome {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
    }
    #tv-banner-cena-sub {
      font-size: 0.75rem;
      color: #a1a1aa;
      letter-spacing: 1px;
    }

    /* STANDEES 2.5D (MINIATURAS EM PÉ COM SOMBRA NO CHÃO) */
    .standee-token-tv {
      position: absolute;
      transform: translate(-50%, -88%);
      transform-origin: bottom center;
      z-index: 25;
      user-select: none;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: left 0.45s cubic-bezier(0.2, 0.85, 0.25, 1), top 0.45s cubic-bezier(0.2, 0.85, 0.25, 1);
    }
    .standee-sombra-chao {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      height: 18px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.4) 50%, rgba(0, 0, 0, 0) 75%);
      border-radius: 50%;
      z-index: 1;
    }
    .standee-figura-tv {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.85));
      pointer-events: none;
    }
    .standee-badge-nome {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e4e4e7;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 1px 7px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 3;
      text-shadow: 0 1px 3px #000;
      opacity: 0.85;
    }

  </style>
</head>
<body>

  <div id="tv-viewport">
    <!-- MODO CENA / CENÁRIO NARRATIVO CINEMÁTICO -->
    <div id="tv-cena-container" style="display: none; position: absolute; inset: 0; width: 100vw; height: 100vh; overflow: hidden; background: #050508;">
      <img id="tv-cena-img" src="" style="width: 100%; height: 100%; object-fit: contain; display: block;">
      <div style="position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px rgba(0,0,0,0.85);"></div>
    </div>

    <!-- MODO TABULEIRO TÁTICO (VTT) -->
    <div id="tv-mapa-container">
      <img id="tv-mapa-img" src="/uploads/mansao_tipora.webp" alt="Mapa 2.5D Ordem Paranormal">
      <canvas id="tv-draw-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;"></canvas>
      <canvas id="tv-fog-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15;"></canvas>
      <div id="tv-camada-tokens" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;"></div>
      <canvas id="tv-ruler-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 35;"></canvas>
      <div id="tv-camada-pings" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 45; pointer-events: none;"></div>
    </div>
  </div>

  
  <!-- OVERLAY CINEMÁTICO & IDENTIDADE ORDEM -->
  <div id="tv-cinematic-overlay"></div>
  <div id="tv-watermark-ordem">ORDEM PARANORMAL</div>

  <!-- BANNER DE CENA DA INVESTIGAÇÃO -->
  <div id="tv-banner-cena">
    <div style="width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 10px #ef4444;"></div>
    <div>
      <div id="tv-banner-cena-nome">Mansão Leone</div>
      <div id="tv-banner-cena-sub">C.R.I.S. • Registro de Cena</div>
    </div>
  </div>

  <div id="tv-standby-screen">
    <img id="tv-standby-img" src="">
    <div id="tv-standby-fallback">
      <h1 style="font-family: monospace; font-size: 3.5rem; color: #ef4444; letter-spacing: 8px; margin: 0; text-shadow: 0 0 20px rgba(239,68,68,0.5);">C.R.I.S.</h1>
      <p style="color: #71717a; font-size: 1.1rem; letter-spacing: 3px; margin: 0; font-weight: bold;">SESSÃO EM ESPERA</p>
    </div>
  </div>

  <!-- TELA DE HANDOUT (PISTAS) NA TV -->
  <div id="tv-handout-overlay" onclick="fecharHandoutTV()">
    <button id="btn-fechar-tv-handout" onclick="event.stopPropagation(); fecharHandoutTV()" style="position: absolute; top: 28px; right: 32px; background: rgba(0,0,0,0.75); border: 2px solid rgba(255,255,255,0.4); color: #fff; font-size: 1.1rem; font-weight: 800; padding: 10px 22px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(8px); z-index: 10000; box-shadow: 0 6px 20px rgba(0,0,0,0.8); transition: transform 0.15s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      <span style="color: #ef4444; font-size: 1.3rem;">✕</span> Fechar Imagem (ESC ou Clique)
    </button>
    <img id="tv-handout-img" src="" alt="Pista da Missão" onclick="event.stopPropagation()">
  </div>

  <div id="toast-turno">
    <div class="toast-titulo" style="color: #60a5fa;">NOVO TURNO</div>
    <div class="toast-resultado" id="toast-turno-nome" style="font-size: 2.2rem; color: #ffffff; text-shadow: 0 0 18px rgba(37, 99, 235, 0.6);">--</div>
    <div class="toast-detalhe-txt" id="toast-turno-prox" style="color: #a1a1aa;">Próximo: --</div>
  </div>

  <div id="toast-rolagem">
    <div class="toast-titulo" id="toast-titulo">ROLAGEM DA MESA</div>
    <div class="toast-resultado" id="toast-texto">--</div>
    <div class="toast-detalhe-txt" id="toast-detalhe-info"></div>
  </div>

  <!-- PALCO DOS DADOS 3D -->
  <div id="dice-canvas"></div>

  <!-- INICIALIZADOR ÚNICO DO DICE BOX NA TV -->
  <script type="module">
    import DiceBox from "/dice-box/dice-box.es.min.js";
    window.diceBox = new DiceBox({
      container: "#dice-canvas",
      assetPath: "/dice-box/assets/",
      theme: "default",
      themeColor: "#b91c1c",
      textColor: "#ffffff",
      scale: 16,
      spinForce: 6,
      throwForce: 6,
      startingHeight: 10
    });
    window.diceBox.init().then(() => {
      window.diceBoxReady = true;
    }).catch(e => console.error("Erro na física do dado TV:", e));
  </script>

  <script>
    const socket = io({ transports: ['websocket'], upgrade: false });
    const VTT_W = 1920;
    const VTT_H = 1080;

    function inicializarCanvas(id) {
      const c = document.getElementById(id);
      if (!c) return null;
      if (c.width !== VTT_W || c.height !== VTT_H) { c.width = VTT_W; c.height = VTT_H; }
      return c.getContext('2d');
    }
    inicializarCanvas('tv-draw-canvas');
    inicializarCanvas('tv-fog-canvas');
    inicializarCanvas('tv-ruler-canvas');

    function aplicarEstadoStandby(emStandby, standbyImg) {
      const standbyEl = document.getElementById('tv-standby-screen');
      const imgEl = document.getElementById('tv-standby-img');
      const fallbackEl = document.getElementById('tv-standby-fallback');
      if (!standbyEl) return;
      if (emStandby) {
        if (standbyImg) {
          imgEl.src = standbyImg;
          imgEl.style.display = 'block';
          fallbackEl.style.display = 'none';
        } else {
          imgEl.style.display = 'none';
          fallbackEl.style.display = 'flex';
        }
        standbyEl.style.display = 'flex';
        requestAnimationFrame(() => standbyEl.style.opacity = '1');
      } else {
        standbyEl.style.opacity = '0';
        setTimeout(() => { if (standbyEl.style.opacity === '0') standbyEl.style.display = 'none'; }, 500);
      }
    }

    function redimensionarContainerMapaTV(img) {
      const container = document.getElementById('tv-mapa-container');
      if (container && img && img.naturalWidth && img.naturalHeight) {
        container.style.width = img.naturalWidth + 'px';
        container.style.height = img.naturalHeight + 'px';
      }
    }

    function exibirMapaNaTV(url) {
      const cenaContainer = document.getElementById('tv-cena-container');
      const mapaContainer = document.getElementById('tv-mapa-container');
      const mapaImg = document.getElementById('tv-mapa-img');

      if (cenaContainer) cenaContainer.style.display = 'none';
      if (mapaContainer) mapaContainer.style.display = 'block';

      if (mapaImg && url) {
        mapaImg.onload = function() {
          redimensionarContainerMapaTV(this);
        };
        mapaImg.src = url;
        if (mapaImg.complete && mapaImg.naturalWidth) {
          redimensionarContainerMapaTV(mapaImg);
        }
      }
    }

    let timerBannerCena = null;
    function exibirCenaNaTV(dados) {
      if (!dados) return;
      const standbyScreen = document.getElementById('tv-standby-screen');
      if (standbyScreen) {
        standbyScreen.style.opacity = '0';
        setTimeout(() => standbyScreen.style.display = 'none', 500);
      }

      const mapaContainer = document.getElementById('tv-mapa-container');
      const cenaContainer = document.getElementById('tv-cena-container');
      const cenaImg = document.getElementById('tv-cena-img');

      if (mapaContainer) mapaContainer.style.display = 'none';
      if (cenaContainer) cenaContainer.style.display = 'block';
      if (cenaImg && dados.imagem) cenaImg.src = dados.imagem;

      const banner = document.getElementById('tv-banner-cena');
      const nomeEl = document.getElementById('tv-banner-cena-nome');
      const subEl = document.getElementById('tv-banner-cena-sub');
      if (banner && nomeEl) {
        nomeEl.innerText = dados.nome || 'Nova Cena';
        if (subEl) subEl.innerText = (dados.andar ? dados.andar + ' • ' : '') + 'Investigação em Andamento';
        banner.classList.add('show');
        if (timerBannerCena) clearTimeout(timerBannerCena);
        timerBannerCena = setTimeout(() => banner.classList.remove('show'), 5000);
      }
    }

    socket.on('tv_sincronizar_inicial', (estado) => {
      if (!estado) return;
      if (estado.modo === 'cena' && estado.cenaAtiva) {
        exibirCenaNaTV(estado.cenaAtiva);
      } else if (estado.mapaAtivoUrl) {
        exibirMapaNaTV(estado.mapaAtivoUrl);
      }
      if (estado.pistaAbertaUrl) {
        const overlay = document.getElementById('tv-handout-overlay');
        const img = document.getElementById('tv-handout-img');
        if (overlay && img) {
          img.src = estado.pistaAbertaUrl;
          overlay.style.display = 'flex';
        }
      }
      aplicarEstadoStandby(estado.emStandby, estado.standbyImg);
    });

    socket.on('tv_definir_standby', ({ emStandby, standbyImg }) => {
      aplicarEstadoStandby(emStandby, standbyImg);
    });

    socket.emit('tv_solicitar_mapa_ativo');

    socket.on('tv_trocar_mapa', (url) => {
      if (url) exibirMapaNaTV(url);
    });

    socket.on('atualizar_tablet', (dados) => {
      exibirCenaNaTV(dados);
    });

    socket.on('tv_mostrar_cena', (dados) => {
      exibirCenaNaTV(dados);
    });

    // Câmera Suave com Interpolação Cinemática
    socket.on('tv_aplicar_camera', (camera) => {
      const container = document.getElementById('tv-mapa-container');
      if (container && camera) {
        container.style.transition = 'transform 0.15s ease-out';
        container.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.zoom})`;
      }
    });

    socket.on('tv_atualizar_tokens', (tokens) => {
      const container = document.getElementById('tv-camada-tokens');
      if (!container) return;
      container.innerHTML = '';
      (tokens || []).forEach(t => {
        if (t.visivel === false) return;
        const div = document.createElement('div');
        div.id = 'tv-token-' + t.id;
        div.className = 'standee-token-tv';
        div.style.left = t.x + '%';
        div.style.top = t.y + '%';
        
        // Standee proporcional (altura vertical com ponto de apoio nos pés)
        const baseLargura = 80 * (t.escala || 1);
        const baseAltura = 115 * (t.escala || 1);
        div.style.width = baseLargura + 'px';
        div.style.height = baseAltura + 'px';

        if (t.img) {
          div.innerHTML = `
            <span class="standee-badge-nome">${t.nome || ''}</span>
            <img class="standee-figura-tv" src="${t.img}" draggable="false">
            <div class="standee-sombra-chao"></div>
          `;
        } else {
          div.innerHTML = `
            <span class="standee-badge-nome">${t.nome || ''}</span>
            <div style="width: 65px; height: 65px; border-radius: 50%; background: #222; border: 2px solid #ef4444; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1.1rem; box-shadow: 0 4px 14px rgba(0,0,0,0.8);">
              ${(t.nome || 'A').substring(0, 2).toUpperCase()}
            </div>
            <div class="standee-sombra-chao"></div>
          `;
        }
        container.appendChild(div);
      });
    });

    socket.on('tv_atualizar_fog', (dataUrl) => {
      const ctx = inicializarCanvas('tv-fog-canvas');
      if (!ctx) return;
      ctx.globalCompositeOperation = 'source-over';
      if (!dataUrl) { ctx.clearRect(0, 0, VTT_W, VTT_H); return; }
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, VTT_W, VTT_H);
        ctx.drawImage(img, 0, 0, VTT_W, VTT_H);
      };
      img.src = dataUrl;
    });

    // Notificação de Turno
    let timerLimparTurnoTV = null;
    socket.on('tv_atualizar_iniciativa', ({ combatentes, turnoIndex }) => {
      if (!combatentes || combatentes.length === 0) return;
      if (timerLimparTurnoTV) clearTimeout(timerLimparTurnoTV);

      const toast = document.getElementById('toast-turno');
      if (!toast) return;

      toast.classList.remove('show');
      const atual = combatentes[turnoIndex];
      let proxIndex = turnoIndex + 1;
      if (proxIndex >= combatentes.length) proxIndex = 0;
      const proximo = combatentes.length > 1 ? combatentes[proxIndex].nome : 'Nenhum';

      document.getElementById('toast-turno-nome').innerText = atual ? atual.nome : '--';
      document.getElementById('toast-turno-prox').innerText = `Próximo: ${proximo}`;

      void toast.offsetWidth;
      toast.classList.add('show');

      timerLimparTurnoTV = setTimeout(() => {
        toast.classList.remove('show');
      }, 5000);
    });

    socket.on('tv_fog_cover_all', () => {
      const ctx = inicializarCanvas('tv-fog-canvas');
      if (ctx) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, VTT_W, VTT_H);
      }
    });

    socket.on('tv_fog_reveal_all', () => {
      const ctx = inicializarCanvas('tv-fog-canvas');
      if (ctx) ctx.clearRect(0, 0, VTT_W, VTT_H);
    });

    socket.on('tv_desenhar_fog', ({ x, y, isNovoTraco, modo, tamanho }) => {
      const ctx = inicializarCanvas('tv-fog-canvas');
      if (!ctx) return;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (modo === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = tamanho;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = '#000000';
        ctx.fillStyle = '#000000';
        ctx.lineWidth = tamanho;
      }
      if (isNovoTraco) {
        ctx.beginPath();
        ctx.arc(x, y, tamanho / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
        ctx.stroke();
      }
    });

    socket.on('tv_desenhar_traco', ({ x, y, isNovoTraco, cor, modo, tamanho }) => {
      const ctx = inicializarCanvas('tv-draw-canvas');
      if (!ctx) return;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (modo === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = tamanho * 4;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = cor;
        ctx.fillStyle = cor;
        ctx.lineWidth = tamanho;
      }
      if (isNovoTraco) {
        ctx.beginPath();
        ctx.arc(x, y, (modo === 'eraser' ? tamanho * 2 : tamanho / 2), 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
        ctx.stroke();
      }
    });

    socket.on('tv_atualizar_desenho', (dataUrl) => {
      const ctx = inicializarCanvas('tv-draw-canvas');
      if (!ctx) return;
      ctx.globalCompositeOperation = 'source-over';
      if (!dataUrl) { ctx.clearRect(0, 0, VTT_W, VTT_H); return; }
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, VTT_W, VTT_H);
        ctx.drawImage(img, 0, 0, VTT_W, VTT_H);
      };
      img.src = dataUrl;
    });

    socket.on('tv_limpar_desenho', () => {
      const ctx = inicializarCanvas('tv-draw-canvas');
      if (ctx) ctx.clearRect(0, 0, VTT_W, VTT_H);
    });

    socket.on('tv_atualizar_regua', ({ p1, p2, gradePx }) => {
      const ctx = inicializarCanvas('tv-ruler-canvas');
      if (!ctx) return;
      ctx.clearRect(0, 0, VTT_W, VTT_H);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.setLineDash([]);
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const distPx = Math.sqrt(dx * dx + dy * dy);
      const metros = ((distPx / (gradePx || 70)) * 1.5).toFixed(1).replace('.0', '');
      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2;
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(midX - 35, midY - 16, 70, 32, 6);
      else ctx.rect(midX - 35, midY - 16, 70, 32);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${metros}m`, midX, midY);
    });

    socket.on('tv_limpar_regua', () => {
      const ctx = inicializarCanvas('tv-ruler-canvas');
      if (ctx) ctx.clearRect(0, 0, VTT_W, VTT_H);
    });

    socket.on('tv_ping', ({ xPct, yPct, cor }) => {
      const container = document.getElementById('tv-camada-pings');
      if (!container) return;
      const ping = document.createElement('div');
      ping.className = 'vtt-ping-beacon';
      ping.style.left = xPct + '%';
      ping.style.top = yPct + '%';
      ping.innerHTML = `<div class="vtt-ping-ring" style="border-color: ${cor};"></div><div class="vtt-ping-dot" style="background-color: ${cor}; box-shadow: 0 0 16px ${cor};"></div>`;
      container.appendChild(ping);
      setTimeout(() => ping.remove(), 1500);
    });

    let timerLimparDadoTV = null;

    socket.on('tv_rolar_dado_box', ({ valor, faces, autor, detalhes }) => {
      if (timerLimparDadoTV) clearTimeout(timerLimparDadoTV);

      const toast = document.getElementById('toast-rolagem');
      if (!toast) return;

      toast.classList.remove('show');

      const isCritico = faces === 20 && valor === 20;
      const isDesastre = faces === 20 && valor === 1;

      toast.style.borderLeftColor = isCritico ? '#22c55e' : isDesastre ? '#ef4444' : '#b91c1c';
      document.getElementById('toast-titulo').innerText = `${(autor || 'MESTRE').toUpperCase()} ROLOU D${faces}`;
      document.getElementById('toast-texto').innerText = valor;
      document.getElementById('toast-texto').style.color = isCritico ? '#86efac' : isDesastre ? '#fca5a5' : '#ffffff';

      let detalheTexto = detalhes || 'Resultado da mesa';
      if (isCritico) detalheTexto = 'ACERTO CRÍTICO! ' + (detalhes ? `| ${detalhes}` : '');
      if (isDesastre) detalheTexto = 'FALHA CRÍTICA! ' + (detalhes ? `| ${detalhes}` : '');

      document.getElementById('toast-detalhe-info').innerText = detalheTexto;

      void toast.offsetWidth;
      toast.classList.add('show');

      timerLimparDadoTV = setTimeout(() => {
        toast.classList.remove('show');
      }, 6000);
    });

    socket.on('alerta_rolagem_mesa', ({ jogador, teste, total, detalhes }) => {
      if (timerLimparDadoTV) clearTimeout(timerLimparDadoTV);
      const toast = document.getElementById('toast-rolagem');
      if (!toast) return;

      toast.classList.remove('show');
      toast.style.borderLeftColor = '#9333ea';
      document.getElementById('toast-titulo').innerText = `${(jogador || 'AGENTE').toUpperCase()} — ${teste}`;
      document.getElementById('toast-texto').innerText = total;
      document.getElementById('toast-texto').style.color = '#ffffff';
      document.getElementById('toast-detalhe-info').innerText = detalhes || 'Resultado da mesa';

      void toast.offsetWidth;
      toast.classList.add('show');

      timerLimparDadoTV = setTimeout(() => {
        toast.classList.remove('show');
      }, 5000);
    });

    // Pistas na TV
    function fecharHandoutTV() {
      const overlay = document.getElementById('tv-handout-overlay');
      if (overlay) overlay.style.display = 'none';
      if (typeof socket !== 'undefined') {
        socket.emit('tv_esconder_handout');
      }
    }
    window.fecharHandoutTV = fecharHandoutTV;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        fecharHandoutTV();
      }
    });

    socket.on('tv_mostrar_handout', (url) => {
      const overlay = document.getElementById('tv-handout-overlay');
      const img = document.getElementById('tv-handout-img');
      if (overlay && img) {
        img.src = url || 'https://images.unsplash.com/photo-1586861214040-5e3650201fc2?q=80&w=800';
        overlay.style.display = 'flex';
      }
    });

    socket.on('tv_esconder_handout', () => {
      const overlay = document.getElementById('tv-handout-overlay');
      if (overlay) overlay.style.display = 'none';
    });
  </script>
</body>
</html>
